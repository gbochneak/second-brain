<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Second Brain</title>
<link rel="stylesheet" href="css/app.css">

<!-- Installable on iPhone via Safari's Share -> Add to Home Screen -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2nd Brain">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> Second Brain</div>
    <nav id="navGroups"></nav>
    <div class="spacer"></div>
    <div class="sidefoot" id="navFoot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="overlay"></div>

<script src="js/store.js"></script>
<script src="js/viewengine.js"></script>
<script src="js/app.js"></script>

<!-- Optional cloud sync (js/sync.js is fully inert until configured from the
     Data page). Loaded from a public CDN; if it fails (offline, blocked),
     window.supabase stays undefined and sync.js's own checks handle that. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/sync.js"></script>

<script src="js/pages/dashboard.js"></script>
<script src="js/pages/areas.js"></script>
<script src="js/pages/projects.js"></script>
<script src="js/pages/goals.js"></script>
<script src="js/pages/tasks.js"></script>
<script src="js/pages/habits.js"></script>
<script src="js/pages/notes.js"></script>
<script src="js/pages/ideas.js"></script>
<script src="js/pages/watchlist.js"></script>
<script src="js/pages/contacts.js"></script>
<script src="js/pages/review.js"></script>
<script src="js/pages/archive.js"></script>
<script src="js/pages/data.js"></script>

<script>App.boot();</script>
</body>
</html>
